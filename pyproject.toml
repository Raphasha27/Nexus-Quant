[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexus-quant"
version = "2.0.0"
description = "Quantitative trading engine with market analytics, anomaly detection and portfolio optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Koketso Raphasha", email = "402106633@my.richfield.ac.za"},
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13.4",
]
keywords = ["quantitative-trading", "market-analytics", "fastapi", "portfolio-optimization", "finance"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "pre-commit>=4.6.1",
]
