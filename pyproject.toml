[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "nexus-quant"
version = "2.0.0"
description = "Quantitative trading engine with market analytics, anomaly detection and portfolio optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Koketso Raphasha", email = "402106633@my.richfield.ac.za"},
]
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
]
keywords = ["quantitative-trading", "market-analytics", "fastapi", "portfolio-optimization", "finance"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.2",
    "pre-commit>=4.7.0",
]
